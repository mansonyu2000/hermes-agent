[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-zentao"
version = "0.1.0"
description = "CLI for ZenTao PM — AI Agent command-line interface to ZenTao REST API"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.scripts]
zentao = "zentao_cli:cli"

[tool.setuptools.packages.find]
include = ["zentao_cli*"]
