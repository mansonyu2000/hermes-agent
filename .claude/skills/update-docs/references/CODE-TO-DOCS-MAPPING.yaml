# WinPeek 代码 → 文档 映射表
#
# 对标 Next.js .agents/skills/update-docs/references/CODE-TO-DOCS-MAPPING.md
# 用途: Agent 改代码后，用此表找出受影响的文档，自动提醒更新。
# 格式: source_pattern → [doc_path, doc_path, ...]

